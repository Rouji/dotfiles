set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g status-interval 5
set -g focus-events on

# --- theme ---
DEFAULT_STYLE="fg=#a9b1d6,bg=#1a1b26"
OFF_STYLE="fg=#1a1b26,bg=#e0af68"
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style $DEFAULT_STYLE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#1a1b26,bg=#{?client_prefix,#e0af68,#7aa2f7},bold] #S #[bg=#1a1b26] "
set -g status-right "#{?#{==:#{client_key_table},off},#[fg=#1a1b26 bg=#e0af68 bold] OFF #[default] ,}#[fg=#565f89]#H  #[fg=#a9b1d6]%a %d.%m  %H:%M "
setw -g window-status-format "#[fg=#565f89] #I #[fg=#a9b1d6]#W#{?window_zoomed_flag,+,} "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#9ece6a,bold] #I #[fg=#9ece6a,bg=#24283b] #W#{?window_zoomed_flag, +,} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#e0af68"
setw -g monitor-activity on
set -g visual-activity off

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#7aa2f7 bold],#[fg=#565f89]} #P #{pane_current_command} #[nobold]#{s|^$HOME|~|:pane_current_path} "

# dim inactive panes
setw -g window-style "fg=#9aa0bd,bg=terminal"
setw -g window-active-style "fg=terminal,bg=terminal"
set -g message-style "fg=#7aa2f7,bg=#24283b"
setw -g mode-style "fg=#1a1b26,bg=#7aa2f7"
set -g display-panes-active-colour "#9ece6a"
set -g display-panes-colour "#7aa2f7"
setw -g clock-mode-colour "#7aa2f7"

set -g set-titles on

# remove escape delay
set -s escape-time 0

# enable mouse
setw -g mouse on

# resize whenever possible
setw -g aggressive-resize on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# vi keys for selection etc.
setw -g mode-keys vi

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt + vi keys
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# kill current window
bind -n M-q kill-window

# new session
bind -n M-n new

unbind-key -T prefix C-z

# turn off/on local prefix to work with nested sessions
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style $OFF_STYLE \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S \;\

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set status-style $DEFAULT_STYLE \;\
    refresh-client -S

# --- plugins (prefix + I to install, prefix + U to update) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# must stay at the very bottom
run '~/.tmux/plugins/tpm/tpm'
